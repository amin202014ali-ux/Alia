nav svg{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}nav button.on{color:var(--p);background:var(--pl)}nav button.on svg{transform:translateY(-2px) scale(1.12)}

.card{background:color-mix(in srgb,var(--c) 74%,transparent);border:1px solid color-mix(in srgb,#fff 55%,transparent);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.6)}

/* A more dimensional science-themed hero */
.hero{background-size:100% 100%;isolation:isolate}
.hero::before{width:390px;height:390px;background:radial-gradient(circle,rgba(45,212,191,.58),rgba(34,211,238,.13) 34%,transparent 68%)}
.hero::after{width:360px;height:360px;background:radial-gradient(circle,rgba(129,140,248,.55),rgba(217,70,239,.12) 38%,transparent 70%)}
.hero .atom{width:108px;height:108px;left:9px;top:8px;filter:drop-shadow(0 0 9px rgba(94,234,212,.75));animation:spin 13s linear infinite}
.hero .atom ellipse{stroke:rgba(220,255,252,.8);stroke-width:1.8;stroke-dasharray:5 4}
.hero .atom circle{filter:drop-shadow(0 0 7px #fff)}
.hero h1{ text-shadow:0 0 18px rgba(94,234,212,.38),0 2px 16px rgba(0,0,0,.2); }

html.n-aurora #fx::before,html.n-aurora #fx::after{display:none}

<script>

R.innerHTML=`<div class="card"><div class="rh">${avt(s)}<div><h1>${nm(s)}</h1><p class="sub" style="margin:0">کارنامه ارزشیابی علوم تجربی — پایه اول<br>تاریخ ارزشیابی: ${esc(s.date)}</p></div>${ring(pc(s))}</div><table><tr><th>درس</th><th>امتیاز</th><th>درصد</th></tr>${S.map((x,i)=>`<tr><td>${fa(i+1)}. ${x[0]}</td><td class="sc">${fa(sum(s,i))} از ${fa(mx(i))}</td><td class="sc">${fa(pc(s,i))}٪</td></tr>`).join('')}<tr><th>مجموع ۱۴ درس</th><th class="sc">${fa(sum(s))} از ${fa(mx())}</th><th class="sc">${fa(pc(s))}٪</th></tr></table><p style="text-align:center"><span class="bg ${lv(pc(s))[1]}">${lv(pc(s))[0]}</span></p>${radar(s)}</div><div class="card"><h3>خلاصه عملکرد دانش‌آموز</h3><div class="stats" style="color:var(--t);background:var(--pl);border-radius:16px"><div class="stat" style="background:transparent;color:var(--g)"><b>${fa(independent.length)}</b><span>پاسخ مستقل</span></div><div class="stat" style="background:transparent;color:var(--a)"><b>${fa(guided.length)}</b><span>با راهنمایی</span></div><div class="stat" style="background:transparent;color:var(--r)"><b>${fa(practice.length)}</b><span>نیازمند تمرین</span></div></div><h3>نقاط قوت</h3>${independent.length?'<ul>'+independent.map(q=>`<li>${q.q} <small>(${S[q.s][0]})</small></li>`).join('')+'</ul>':'<p>هنوز پاسخ مستقل ثبت نشده است.</p>'}<h3>مفاهیم نیازمند تمرین</h3>${practice.length?'<ul>'+practice.map(q=>`<li>${q.q} <small>(${S[q.s][0]})</small></li>`).join('')+'</ul>':'<p>موردی ثبت نشده است.</p>'}<h3>پاسخ‌های صحیح با راهنمایی</h3>${guided.length?'<ul>'+guided.map(q=>`<li>${q.q} <small>(${S[q.s][0]})</small></li>`).join('')+'</ul>':'<p>موردی ثبت نشده است.</p>'}</div><div class="card"><h3>امتیاز سؤال‌ها</h3><table>${S.map((x,i)=>`<tr><th colspan="2">${fa(i+1)}. ${x[0]}</th></tr>`+Q.filter(q=>q.s===i).map(q=>`<tr><td>${fa(q.n)}. ${q.q}</td><td class="sc">${s.sc[Q.indexOf(q)]==null?'—':fa(s.sc[Q.indexOf(q)])}</td></tr>`).join('')).join('')}</table></div><div class="card"><h3>یادداشت معلم</h3><p>${esc(s.note)||'—'}</p><p class="np"><button class="b" onclick="print()">${ic('print')}چاپ / ذخیره PDF</button><button class="b s" onclick="copyReport('${s.id}')">کپی گزارش متنی برای مدیر</button><button class="b s" onclick="edit('${s.id}')">ویرایش</button><button class="b s" onclick="go('list')">فهرست</button></p></div>`}

async function ex(){const j=JSON.stringify({app:'sci1',v:1,students:await all()});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='backup-science-grade1.json';a.click();toast('اگر دانلود نشد، از «کپی متن پشتیبان» استفاده کنید')}
async function cp(){const t=$('#bx');t.select();try{await navigator.clipboard.writeText(t.value);toast('کپی شد')}catch(e){document.execCommand('copy');toast('متن انتخاب شد؛ کپی کنید')}}
function rf(f){if(f){const r=new FileReader();r.onload=()=>im(r.result);r.readAsText(f)}}
async function im(t){try{const d=JSON.parse(t),a=d.students;if(d.app!=='sci1'||!Array.isArray(a))throw 0;let n=0;for(const s of a){if(!s.id||!Array.isArray(s.sc)||(s.sc.length!==26&&s.sc.length!==Q.length))continue;normalizeScores(s);const o=await get('st',s.id);if(!o||(s.upd||0)>=(o.upd||0)){await put(s);n++}}toast(fa(n)+' کارنامه بازیابی شد');go('list')}catch(e){toast('فایل پشتیبان معتبر نیست')}}
function cu(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,sf=e.dataset.s||'';if(!FX.count){e.textContent=fa(n)+sf;return}let t0;const f=t=>{t0??=t;const k=Math.min((t-t0)/700,1);e.textContent=fa(Math.round(n*k))+sf;k<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}
document.addEventListener('pointerdown',e=>{if(!FX.tap)return;const b=e.target.closest('.b,.ib,nav button:not(.pl)');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
function confetti(){if(!FX.cf||document.documentElement.classList.contains('lowfx')||document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';const dpr=Math.min(devicePixelRatio||1,1.25);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);document.body.appendChild(c);const x=c.getContext('2d',{alpha:true});if(!x){c.remove();return}x.scale(dpr,dpr);const P=Array.from({length:64},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*10-2,r:Math.random()*4+2,h:Math.random()*360,a:Math.random()*6}));let t=0,raf=0;(function f(){if(document.hidden){c.remove();return}x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.a+=.16;x.fillStyle=`hsl(${p.h} 80% 60%)`;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<115)raf=requestAnimationFrame(f);else c.remove()})();}
const FXL=[['bg','پس‌زمینه زنده','حباب‌های نوری شناور پشت صفحه'],['hero','هدر صفحه اصلی','اتم چرخان و نورهای هدر'],['enter','ورود نرم کارت‌ها','ورود نرم و کوتاه کارت‌ها و ردیف‌ها'],['rv','نمایش هنگام اسکرول','ظاهر شدن تدریجی سؤال‌ها هنگام رسیدن به آن‌ها'],['fill','نوارها، حلقه‌ها و نمودار','پر شدن تدریجی نوارها و حلقه‌های امتیاز'],['count','شمارش اعداد','شمارش نرم اعداد داشبورد'],['shine','درخشش دکمه‌ها','بازتاب نور روی دکمه‌های اصلی'],['tap','موج لمس','موج کوچک هنگام لمس دکمه‌ها'],['blur','شیشه مات منو و نوار امتیاز','بلور واقعی؛ در گوشی ضعیف خاموش بماند'],['cf','کاغذرنگی کارنامه','جشن کوتاه هنگام کارنامه عالی'],['vib','لرزش گوشی','لرزش کوتاه هنگام انتخاب امتیاز'],['glow','درخشش عنوان','هاله نوری آرام دور عنوان اصلی'],['sweep','عبور نور سینمایی','عبور آرام نور از روی عنوان هدر'],['halo','هاله‌های پس‌زمینه','نورهای محیطی ثابت و سبک'],['float','شناوری کارت‌های آمار','حرکت بسیار کم کارت‌های آمار'],['cardfx','تعامل کارت‌ها','بالا آمدن بسیار کم کارت‌ها با اشاره‌گر'],['qfx','نور راهنمای سؤال','خط نور ظریف کنار سؤالی که روی آن کار می‌کنید'],['aurora','شفق قطبی پس‌زمینه','لایه‌های رنگی متحرک و آرام پشت صفحه'],['orbit','مدار اتمی هدر','چرخش مدارهای علمی کنار عنوان'],['edge','لبه‌های شیشه‌ای کارت‌ها','درخشش ظریف کارت فعال و بخش انتخاب‌شده'],['score','بازخورد انتخاب امتیاز','جهش کوتاه و نور لحظه‌ای هنگام امتیازدهی'],['progress','درخشش نوار پیشرفت','عبور نور روی نوارهای درصد و امتیاز'],['nav','نور منوی پایین','تأکید نوری ملایم روی آیکون منوی فعال']];
const FXK=FXL.map(x=>x[0]),FXN=Object.fromEntries(FXL.map(x=>[x[0],x[1]]));
let FX={},_m=0,tries=0,busy=0,strikes=0,st;FXK.forEach(k=>FX[k]=1);
try{const o=JSON.parse(localStorage.getItem('fxs')||'{}');FXK.forEach(k=>{if(o[k]===0)FX[k]=0});_m=+localStorage.getItem('fxm')||0}catch(e){}
const LOW_DEVICE=(/Android/i.test(navigator.userAgent)&&((navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)));document.documentElement.classList.toggle('lowfx',LOW_DEVICE);
function fxPreset(mode){if(mode==='lite'){FXK.forEach(k=>FX[k]=0);['enter','rv','fill','count','tap'].forEach(k=>FX[k]=1)}else if(mode==='balanced'){FXK.forEach(k=>FX[k]=0);['bg','hero','enter','rv','fill','count','shine','tap','glow','sweep','float','aurora','orbit','edge','score','progress','nav'].forEach(k=>FX[k]=1)}else{FXK.forEach(k=>FX[k]=1)}_m=1;try{localStorage.setItem('fxm','1')}catch(e){}fxApply();fxSave();draw()}
function fxApply(){FXK.forEach(k=>document.documentElement.classList.toggle('n-'+k,!FX[k]))}
function fxSave(){try{localStorage.setItem('fxs',JSON.stringify(FX))}catch(e){}}
function setFx(k,on){FX[k]=on?1:0;_m=1;try{localStorage.setItem('fxm','1')}catch(e){}fxApply();fxSave()}
function allFx(on){FXK.forEach(k=>FX[k]=on?1:0);_m=1;try{localStorage.setItem('fxm','1')}catch(e){}fxApply();fxSave();draw()}
function fxUI(){return `<div class="card"><h2>تنظیمات انیمیشن و جلوه‌های ویژه</h2><p class="sub">حالت اجرا را انتخاب کن یا هر جلوه را جداگانه روشن و خاموش کن. تنظیمات روی همین گوشی ذخیره می‌شوند.</p><div class="fx-presets"><button class="b s" onclick="fxPreset('lite')">🚀 سبک</button><button class="b s" onclick="fxPreset('balanced')">✨ متعادل</button><button class="b s" onclick="fxPreset('full')">⚡ کامل</button></div><div class="fx-note">${LOW_DEVICE?'حالت محافظ دستگاه فعال است؛ برای روان ماندن گوشی، چند افکت سنگین به‌صورت خودکار محدود می‌شوند.':'برای اجرای روان، افکت‌های پس‌زمینه و شیشه مات هنگام اسکرول متوقف می‌شوند.'} اگر گوشی داغ یا کند شد، حالت «سبک» را بزن.</div>${FXL.map(x=>`<label class="sw"><input type="checkbox" ${FX[x[0]]?'checked':''} onchange="setFx('${x[0]}',this.checked)"><span><b>${x[1]}</b><small>${x[2]}</small></span></label>`).join('')}<p><button class="b s" onclick="allFx(1)">روشن‌کردن همه</button><button class="b s" onclick="allFx(0)">خاموش‌کردن همه</button></p></div>`}
function rev(){if(!FX.rv||!window.IntersectionObserver)return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.06,rootMargin:'0px 0px -6% 0px'});document.querySelectorAll('.q,main>.card:nth-child(n+4)').forEach(el=>{el.classList.add('rv');io.observe(el)})}
fxApply();
function probe(n){if(_m||tries>8||busy)return;busy=1;tries++;let t0=0,i=0,bad=0;const f=t=>{if(t0){const d=t-t0;if(d>34&&d<400)bad++}t0=t;if(++i<n)requestAnimationFrame(f);else{busy=0;if(bad/n>.35){if(++strikes>=2){strikes=0;const k=['blur','bg','hero','shine'].find(x=>FX[x]);if(k){FX[k]=0;fxApply();fxSave();toast('برای روان‌تر شدن، «'+FXN[k]+'» خاموش شد')}}}else strikes=0}};requestAnimationFrame(f)}
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('paused',document.hidden));
setTimeout(()=>probe(90),2500);
addEventListener('scroll',()=>{const c=document.documentElement.classList;c.add('scr');clearTimeout(st);st=setTimeout(()=>c.remove('scr'),160);if(!busy&&!window._sp){window._sp=1;probe(50);setTimeout(()=>window._sp=0,3000)}},{passive:true});
const _d=draw;draw=async function(){await _d();cu();rev();if(view==='report'&&window._cf){window._cf=0;confetti()}};
draw();
